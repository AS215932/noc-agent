[project]
name = "noc-agent"
version = "0.1.0"
description = "AS215932 autonomous NOC triage agent (Alertmanager + Icinga2 webhooks → PydanticAI investigation → Discord)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-ai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.27.0",
    "google-genai>=1.0",
    "prometheus-client>=0.25.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
noc-agent = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
