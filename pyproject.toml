[project]
name = "noc-agent"
version = "0.1.0"
description = "AS215932 autonomous NOC triage agent (Alertmanager + Icinga2 webhooks → PydanticAI investigation → Discord)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-ai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.27.0",
    "google-genai>=1.0",
    "prometheus-client>=0.25.0",
    "structlog>=24.4",
    "google-cloud-monitoring>=2.30.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-redis>=0.4.1",
    "langgraph-checkpoint-postgres>=3.0",
    "redis>=5.2.1",
    "discord.py>=2.5.0",
    "pyjwt[crypto]>=2.9",
    "asyncpg>=0.30",
    "agent-core",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
noc-agent = "app.main:main"
noc-agent-bot = "app.discord_bot:main"
nocctl = "app.nocctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "RUF012"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.uv.sources]
agent-core = { git = "https://github.com/AS215932/agent-core", tag = "v0.7.0" }

[[tool.mypy.overrides]]
module = [
    "app.discord",
    "app.discord_bot",
    "app.graph.checkpointing",
    "app.graph.nodes",
    "app.graph_runtime",
    "app.mail",
    "app.main",
    "app.quota",
    "app.tools.mcp_client",
]
ignore_errors = true
