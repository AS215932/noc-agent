name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: '3.14'

      - name: Install uv
        run: |
          if [ ! -x "$HOME/.local/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync deps
        run: ~/.local/bin/uv sync --frozen --group dev

      - name: Ruff
        run: ~/.local/bin/uv run ruff check .

      - name: Mypy
        run: ~/.local/bin/uv run mypy app

      - name: Pytest
        run: ~/.local/bin/uv run pytest -q
