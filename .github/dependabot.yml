version: 2
updates:
  # Dependency PRs run the normal required `test` + `semgrep` gate on the
  # unprivileged hyrule-public-pr runner and need review before merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
